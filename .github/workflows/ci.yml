name: CI — Lint, Test, Security, Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────
  # 1. Lint — JS + CSS/SCSS
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS/SCSS
        run: npm run lint:css

  # ─────────────────────────────────────────
  # 2. Security — Audit + CodeQL
  # ─────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # ─────────────────────────────────────────
  # 3. Test — Jest unit tests
  # ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens (required by tokens.test.js)
        run: npm run build:tokens

      - name: Build icons (required by icons.test.js)
        run: npm run build:icons

      - name: Run tests with coverage
        run: npm test -- --ci --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # ─────────────────────────────────────────
  # 4. Build — Ensure production build works
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Build CSS
        run: npm run build:css

      - name: Verify dist output
        run: |
          test -f dist/index.css || (echo "❌ dist/index.css missing" && exit 1)
          echo "✅ Build output verified"

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/index.css)
          echo "CSS bundle size: ${SIZE} bytes"
          if [ $SIZE -gt 409600 ]; then
            echo "❌ Bundle too large: ${SIZE} bytes (limit: 400KB)"
            exit 1
          fi
          echo "✅ Bundle size within limits"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # 5. PR Size Check
  # ─────────────────────────────────────────
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          CHANGES=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | grep -o '[0-9]* insertion' | grep -o '[0-9]*' || echo "0")
          echo "Lines changed: ${CHANGES}"
          if [ "${CHANGES:-0}" -gt 500 ]; then
            echo "⚠️ Large PR: ${CHANGES} lines changed. Consider splitting into smaller PRs."
          else
            echo "✅ PR size is reasonable"
          fi

  # ─────────────────────────────────────────
  # 6. Dependency Review (PRs only)
  # Requires dependency graph enabled in repo settings:
  # Settings → Security → Code security → Dependency graph
  # ─────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
